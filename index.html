<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engagement Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF3EC;
    --charcoal:#332C28;
    --rose:#B98079;
    --gold:#C9A961;
    --gold-soft:#DCC98F;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--ivory);
  }
  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 0;
    background:
      radial-gradient(circle at 50% 18%, rgba(201,169,97,0.10), transparent 55%),
      var(--ivory);
  }
  .frame{
    width:min(560px, 88vw);
    text-align:center;
    padding:48px 32px;
  }

  /* Ring sketch */
  .rings{
    width:120px;
    height:70px;
    margin:0 auto 18px;
    display:block;
  }
  .rings circle{
    fill:none;
    stroke:var(--gold);
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-dasharray:170;
    stroke-dashoffset:170;
    animation:draw 1.4s ease-out forwards;
  }
  .rings circle.c2{ animation-delay:0.5s; }

  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }

  .eyebrow{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:0.28em;
    color:var(--rose);
    opacity:0;
    transform:translateY(8px);
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:1.6s;
    margin:0 0 14px;
  }

  .names{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(38px, 8vw, 58px);
    line-height:1.08;
    color:var(--charcoal);
    margin:0;
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 1s ease-out forwards;
    animation-delay:1.95s;
  }
  .names .amp{
    font-style:italic;
    color:var(--rose);
    font-size:0.75em;
    padding:0 6px;
  }

  .divider{
    width:0;
    height:1px;
    background:var(--gold);
    margin:24px auto;
    animation:growLine 0.8s ease-out forwards;
    animation-delay:2.9s;
  }
  @keyframes growLine{ to{ width:64px; } }

  .invite-line{
    font-family:'Jost',sans-serif;
    font-weight:300;
    font-size:16px;
    letter-spacing:0.02em;
    color:var(--charcoal);
    opacity:0;
    max-width:380px;
    margin:0 auto 26px;
    line-height:1.6;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:3.3s;
  }

  .details{
    font-family:'Jost',sans-serif;
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:3.9s;
  }
  .details .date{
    font-size:22px;
    font-weight:500;
    color:var(--charcoal);
    letter-spacing:0.04em;
    margin-bottom:6px;
  }
  .details .venue{
    font-size:14px;
    font-weight:300;
    color:#6b6058;
    letter-spacing:0.02em;
  }

  .actions{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:26px;
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:4.3s;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    padding:11px 20px;
    border:1px solid var(--gold);
    border-radius:2px;
    background:transparent;
    color:var(--charcoal);
    transition:background 0.25s ease, color 0.25s ease;
  }
  .btn:hover{
    background:var(--gold);
    color:var(--ivory);
  }
  .btn svg{
    width:15px;
    height:15px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.6;
  }

  /* Embedded venue map */
  .map-wrap{
    margin:24px auto 0;
    max-width:440px;
    border:1px solid var(--gold-soft);
    border-radius:3px;
    overflow:hidden;
    line-height:0;
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:4.6s;
  }
  .map-wrap iframe{
    width:100%;
    height:190px;
    border:0;
    display:block;
    filter:saturate(0.9);
  }

  /* Language toggle */
  .lang-toggle{
    position:fixed;
    top:16px;
    right:16px;
    z-index:10;
    display:inline-flex;
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    border:1px solid var(--gold-soft);
    border-radius:20px;
    overflow:hidden;
    background:rgba(250,243,236,0.85);
    backdrop-filter:blur(4px);
  }
  .lang-toggle button{
    border:0;
    background:transparent;
    cursor:pointer;
    padding:6px 14px;
    color:#8a7f75;
    font:inherit;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .lang-toggle button.active{
    background:var(--gold);
    color:var(--ivory);
  }

  /* Devanagari typography when Hindi is active */
  body.hi .eyebrow,
  body.hi .invite-line,
  body.hi .details,
  body.hi .venue,
  body.hi .btn{
    font-family:'Mukta',sans-serif;
  }
  body.hi .names,
  body.hi .closing{
    font-family:'Tiro Devanagari Hindi',serif;
  }
  body.hi .names{ font-size:clamp(34px, 7.2vw, 52px); }
  body.hi .eyebrow{ letter-spacing:0.12em; }

  .closing{
    margin-top:30px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:17px;
    color:var(--rose);
    opacity:0;
    animation:riseIn 0.9s ease-out forwards;
    animation-delay:4.9s;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  /* editable-hint badge, purely for the editing screen, hidden when recording if you like */
  .edit-hint{
    position:absolute;
    bottom:14px;
    right:18px;
    font-family:'Jost',sans-serif;
    font-size:10px;
    letter-spacing:0.06em;
    color:#b9ab9c;
  }
</style>
</head>
<body>
<div class="lang-toggle" role="group" aria-label="Language">
  <button type="button" id="langEn" class="active">EN</button>
  <button type="button" id="langHi">हिं</button>
</div>
<div class="stage">
  <div class="frame">
    <svg class="rings" viewBox="0 0 120 70">
      <circle class="c1" cx="46" cy="35" r="26"/>
      <circle class="c2" cx="74" cy="35" r="26"/>
    </svg>

    <p class="eyebrow" id="t_eyebrow">TOGETHER WITH THEIR FAMILIES</p>

    <h1 class="names" id="t_names">Pranav <span class="amp">&amp;</span> Shanu</h1>

    <div class="divider"></div>

    <p class="invite-line" id="t_invite">request the pleasure of your company as they celebrate their engagement</p>

    <div class="details">
      <div class="date" id="t_date">Sunday, the 18th of October</div>
      <div class="venue" id="venueLine">Ten in the morning</div>
    </div>

    <div class="actions">
      <a class="btn" id="dirBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.4-7-11a7 7 0 0 1 14 0c0 4.6-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span class="lbl">Get Directions</span>
      </a>
      <a class="btn" id="videoBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
        <span class="lbl">Watch Video</span>
      </a>
      <button class="btn" id="calBtn" type="button">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <span class="lbl">Save to Calendar</span>
      </button>
    </div>

    <div class="map-wrap" id="mapWrap"></div>

    <p class="closing" id="t_closing">With love, we hope you'll be there</p>
  </div>
  <div class="edit-hint">edit details in the CONFIG block in the code</div>
</div>

<script>
  /* ===== Configure your event here ===== */
  const CONFIG = {
    eventTitle:   "Pranav & Shanu — Engagement",
    venueName:    "Hotel The Oasis",
    venueAddress: "Delhi - Saharanpur Rd, Rohit Vihar, Saharanpur, Milk Waziuddinpur, Uttar Pradesh 247001",
    // Directions link — routes from each guest's own location to the full venue address
    directionsUrl: "https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent("Hotel The Oasis, Delhi - Saharanpur Rd, Rohit Vihar, Saharanpur, Milk Waziuddinpur, Uttar Pradesh 247001"),
    // Embedded map iframe src
    mapEmbedUrl:  "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3457.585224305666!2d77.5351508!3d29.933840999999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390e9534caee2aa5%3A0xd54b84d4c5c085b0!2sHotel%20The%20Oasis!5e0!3m2!1sen!2sin!4v1788435641464!5m2!1sen!2sin",
    // Paste your Google Drive (or YouTube) video link here. Leave "" to hide the button.
    videoUrl:     "",
    // Start time WITH timezone offset (IST is +05:30). End time defaults to +6 hours.
    eventStart:   "2026-10-18T10:00:00+05:30",
    durationHours: 6,
  };
  /* ===================================== */

  /* ===== Bilingual text (English / Hindi) ===== */
  const STRINGS = {
    en: {
      eyebrow: "TOGETHER WITH THEIR FAMILIES",
      names:   'Pranav <span class="amp">&amp;</span> Shanu',
      invite:  "request the pleasure of your company as they celebrate their engagement",
      date:    "Sunday, the 18th of October",
      time:    "10:00 AM onwards",
      venue:   "Hotel The Oasis",
      closing: "With love, we hope you'll be there",
      dir:     "Get Directions",
      video:   "Watch Video",
      cal:     "Save to Calendar",
    },
    hi: {
      eyebrow: "अपने परिवार के साथ",
      names:   'प्रणव <span class="amp">और</span> शानू',
      invite:  "अपनी सगाई के शुभ अवसर पर आपकी उपस्थिति की सादर प्रार्थना करते हैं",
      date:    "रविवार, 18 अक्टूबर",
      time:    "सुबह 10:00 बजे से",
      venue:   "होटल द ओएसिस",
      closing: "सादर — हमें आपके आने की प्रतीक्षा रहेगी",
      dir:     "रास्ता देखें",
      video:   "वीडियो देखें",
      cal:     "कैलेंडर में जोड़ें",
    },
  };

  function applyLang(lang){
    const s = STRINGS[lang] || STRINGS.en;
    document.getElementById("t_eyebrow").textContent = s.eyebrow;
    document.getElementById("t_names").innerHTML = s.names;
    document.getElementById("t_invite").textContent = s.invite;
    document.getElementById("t_date").textContent = s.date;
    document.getElementById("venueLine").innerHTML = s.time + " &middot; " + s.venue;
    document.getElementById("t_closing").textContent = s.closing;
    document.querySelector("#dirBtn .lbl").textContent = s.dir;
    document.querySelector("#videoBtn .lbl").textContent = s.video;
    document.querySelector("#calBtn .lbl").textContent = s.cal;
    document.body.classList.toggle("hi", lang === "hi");
    document.documentElement.lang = lang;
    document.getElementById("langEn").classList.toggle("active", lang !== "hi");
    document.getElementById("langHi").classList.toggle("active", lang === "hi");
    try { localStorage.setItem("inviteLang", lang); } catch(e){}
  }

  document.getElementById("langEn").addEventListener("click", () => applyLang("en"));
  document.getElementById("langHi").addEventListener("click", () => applyLang("hi"));

  let saved = "en";
  try { saved = localStorage.getItem("inviteLang") || "en"; } catch(e){}
  const urlLang = new URLSearchParams(location.search).get("lang");
  if (urlLang === "hi" || urlLang === "en") saved = urlLang;
  applyLang(saved);
  /* ============================================ */

  // Directions button
  document.getElementById("dirBtn").href = CONFIG.directionsUrl;

  // Video button — shown only when a link is configured
  const videoBtn = document.getElementById("videoBtn");
  if (CONFIG.videoUrl) {
    videoBtn.href = CONFIG.videoUrl;
  } else {
    videoBtn.style.display = "none";
  }

  // Embedded venue map
  if (CONFIG.mapEmbedUrl) {
    const iframe = document.createElement("iframe");
    iframe.src = CONFIG.mapEmbedUrl;
    iframe.loading = "lazy";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.title = CONFIG.venueName;
    document.getElementById("mapWrap").appendChild(iframe);
  } else {
    document.getElementById("mapWrap").style.display = "none";
  }

  // Build & download an .ics calendar event
  function pad(n){ return String(n).padStart(2, "0"); }
  function toICSDate(d){
    return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate())
      + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
  }
  function icsEscape(s){
    return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  }
  document.getElementById("calBtn").addEventListener("click", function(){
    const start = new Date(CONFIG.eventStart);
    const end   = new Date(start.getTime() + CONFIG.durationHours * 3600 * 1000);
    const ics = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//engagement-invite//EN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:" + start.getTime() + "@engagement-invite",
      "DTSTAMP:" + toICSDate(new Date()),
      "DTSTART:" + toICSDate(start),
      "DTEND:" + toICSDate(end),
      "SUMMARY:" + icsEscape(CONFIG.eventTitle),
      "LOCATION:" + icsEscape(CONFIG.venueName + ", " + CONFIG.venueAddress),
      "URL:" + icsEscape(CONFIG.directionsUrl),
      "END:VEVENT",
      "END:VCALENDAR",
    ].join("\r\n");

    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "engagement.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
